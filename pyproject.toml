[project]
name = "aiagent"
version = "0.2.0"
description = "Agentic pre-screening tool for JACoW/IPAC conference paper submissions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pylatexenc>=2.10",
    "bibtexparser>=1.4,<2",  # 2.x removed bibtexparser.bparser
    "openai>=1.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pdfplumber>=0.11.9",
    "python-docx>=1.2.0",
    "pylatexenc>=2.10",            # LaTeX in references -> text (fine-tuning data)
    # The reference engine: parsing, lookups, integrity, formatting and the
    # check_rewrite guard.  Pinned to a release tag; bump deliberately.
    "jacow-reference-formatter @ git+https://github.com/IPAC2027/jacow-reference-formatter@v1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "reportlab>=4",
]

[project.scripts]
aiagent = "main:app"

[tool.pytest.ini_options]
markers = [
    "network: test that requires external network access",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "main.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
