[project]
name = "aiagent"
version = "0.1.0"
description = "Agentic pre-screening tool for JACoW/IPAC conference paper submissions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pylatexenc>=2.10",
    "bibtexparser>=1.4",
    "openai>=1.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pdfplumber>=0.11.9",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[project.scripts]
aiagent = "main:app"

[tool.pytest.ini_options]
markers = [
    "network: test that requires external network access",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "main.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
